name: reels
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: reels
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0 libfribidi0
          pip install -r requirements.txt
      - name: Run
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          PAGE_TOKEN_1: ${{ secrets.PAGE_TOKEN_1 }}
          PAGE_TOKEN_2: ${{ secrets.PAGE_TOKEN_2 }}
          PAGE_TOKEN_3: ${{ secrets.PAGE_TOKEN_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
